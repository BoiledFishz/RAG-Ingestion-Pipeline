[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "enterprise-ai-agent"
version = "0.1.0"
description = "Evidence-grounded Agentic RAG service with rewrite, retrieval and compression"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "ijson>=3.3,<4",
  "pydantic>=2.9,<3",
  "qdrant-client>=1.12,<2",
  "uvicorn>=0.32,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.hatch.build.targets.wheel]
packages = ["api", "agents", "tools", "vectorstore", "models", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["api", "agents", "tools", "vectorstore", "models", "evaluation"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["qdrant_client.*"]
follow_imports = "skip"
