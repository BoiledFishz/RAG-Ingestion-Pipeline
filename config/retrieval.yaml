# Serving uses environment variables; this is the documented full TechQA profile.
retrieval:
  dataset: IBM TechQA
  mode: hybrid
  candidate_k: 30
  rerank_k: 20
  final_k: 5
  rrf_rank_constant: 60
  max_context_tokens: 8000
  max_chunks_per_document: 2
  reranker_timeout_seconds: 120
  reranker_provider: nomic
  dense_embedding: hash-sha256-384-v1
  calibration: config/techqa_thresholds.json
  fallback_query_coverage_threshold: 0.5
