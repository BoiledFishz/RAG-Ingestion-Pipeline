name: techqa-project2-course
services:
  api:
    image: techqa-project2-course:local
    build:
      context: ../..
      dockerfile: containers/project2/Dockerfile
      network: none
    ports:
      - "127.0.0.1:18012:8000"
    env_file:
      - ../../.container-secrets.env
    environment:
      PROJECT2_OLLAMA_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../.rag_data/techqa_full.sqlite:/app/.rag_data/techqa_full.sqlite:ro
      - ../../.rag_data/techqa_semantic:/app/.rag_data/techqa_semantic:ro
      - ../../.rag_data/models/minilm:/app/.rag_data/models/minilm:ro
      - ../../.container-cache-seed.sqlite:/cache-seed.sqlite:ro
      - rerank_cache:/app/.rag_data/rerank_cache
      - state:/app/.rag_data/project2_runtime
      - logs:/app/audit/project2-v1
    mem_limit: 6g
    stop_grace_period: 15s
volumes:
  state:
  logs:
  rerank_cache:
